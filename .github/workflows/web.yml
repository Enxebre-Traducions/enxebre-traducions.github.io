name: Publicar a web

on:
  push:
    branches: ["main"]
    paths: ["web/**", "castlevania-nes/castlevania_galego.*", ".github/workflows/web.yml", "ferramentas/comentarios.py"]
  # cada comentario novo nunha ficha volve publicar a web, para que saia na portada
  discussion_comment:
    types: [created, edited, deleted]
  discussion:
    types: [deleted]
  workflow_dispatch:

permissions:
  contents: read
  discussions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.163.1
    steps:
      - name: Instalar Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Descargar o repositorio
        uses: actions/checkout@v4
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Ler os comentarios das fichas
        # se falla, a web publícase igual, sen a sección de comentarios
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ferramentas/comentarios.py
      - name: Compilar
        working-directory: web
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Subir a web
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
