baseURL = "https://enxebre-traducions.github.io/"
locale = "gl"
defaultContentLanguage = "gl"
title = "Enxebre Traducións"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  # Verificación de Google Search Console
  verificacionGoogle = "g0t5IgPL7uYtVTd2uJ3v69LyjrpTwrk2GgoPiGBLQaE"
  descricion = "Videoxogos traducidos ao galego, dos clásicos de consola aos de PC para Linux. Ti pos o xogo, nós o galego: aquí só hai traducións."
  repo = "https://github.com/enxebre-traducions/enxebre-traducions.github.io"

  # Doazóns: a ligazón de PayPal (paypal.me/... ou a de «Doar» de PayPal).
  # Mentres estea baleira, o botón non aparece en ningures.
  [params.doazons]
    paypal = "https://paypal.me/Calculinpizza"

  # A canle de YouTube coas reseñas dos xogos. ferramentas/videos_youtube.py
  # le o seu feed e pon o vídeo de cada xogo na súa ficha (sección «En vídeo»).
  [params.youtube]
    canle = "Santa Campaña"
    id = "UCRyFkDd2Z94aNl2jB4K1ucA"
    url = "https://www.youtube.com/channel/UCRyFkDd2Z94aNl2jB4K1ucA"

  # Comentarios con giscus: gárdanse nas Discussions do repositorio.
  # Cada xogo ten o seu fío polo nome da ficha (non pola URL), así que
  # sobreviven a un cambio de dominio.
  [params.giscus]
    repo = "Enxebre-Traducions/enxebre-traducions.github.io"
    repoId = "R_kgDOVXLV1w"
    categoria = "Announcements"
    categoriaId = "DIC_kwDOVXLV184DJmwf"
    # giscus aínda non ten galego
    lingua = "es"

[markup.goldmark.renderer]
  unsafe = true

[outputs]
  home = ["html", "rss"]
  section = ["html"]

# Os parches sérvense directamente desde as carpetas de cada tradución,
# sen copialos: así a web e as releases non poden desincronizarse.
[[module.mounts]]
  source = "static"
  target = "static"
[[module.mounts]]
  source = "../castlevania-nes"
  target = "static/parches/castlevania-nes"
  files = ["castlevania_galego.ips", "castlevania_galego.bps"]
